# .github/workflows/ci.yml
name: ML Pipeline CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-and-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  uv sync --all-extras

            - name: Lint Code with Ruff
              run: |
                  uv run ruff check src/ tests/

            - name: Run Unit Tests
              run: |
                  # We run tests to ensure the FastAPI endpoints and data loaders work
                  uv run pytest tests/ -v
